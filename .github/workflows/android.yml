# ─────────────────────────────────────────────────────────────────────────────
#  Leaf — Android CI/CD
#
#  Copy this file into the app repository as  .github/workflows/android.yml
#  (the build agent can do it: "add ci/android.yml from the design package as
#  .github/workflows/android.yml").
#
#  What it does
#    • every push / PR          → lint + unit tests + debug APK uploaded as an artifact
#    • every tag  v*            → signed release APK + AAB attached to a GitHub Release
#    • optional (commented)     → screenshot tests and emulator smoke tests
#
#  Required repository secrets (Settings → Secrets and variables → Actions)
#    KEYSTORE_BASE64      base64 of your release keystore (.jks)     — optional at first
#    KEYSTORE_PASSWORD    the keystore password
#    KEY_ALIAS            the key alias inside the keystore
#    KEY_PASSWORD         the key password
#  Without them the release job still runs and publishes an *unsigned* APK,
#  so the pipeline is green from the very first commit.
# ─────────────────────────────────────────────────────────────────────────────
name: Android CI

on:
  push:
    # 'arena/**' covers the working branch this build is developed on: this
    # repository does not fire pull_request events, so push is the only trigger
    # that produces a run (and therefore an APK artifact) for a feature branch.
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # needed to publish releases

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"
  JAVA_VERSION: '17'       # AGP 8.13 requires JDK 17+

jobs:
  # ── every push and PR ──────────────────────────────────────────────────────
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # pipefail + tee: the full Gradle console is kept as an artifact, so a failure
      # can be read without downloading the job log (§13: verify every milestone).
      - name: Lint + unit tests
        run: |
          set -o pipefail
          ./gradlew lint testDebugUnitTest --stacktrace 2>&1 | tee gradle-build.log

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # The sandbox this project is developed in cannot download Actions artifacts or
      # job logs, so the interesting part of the Gradle console is committed back to the
      # branch under ci-logs/ where it can simply be pulled and read. [skip ci] keeps
      # that commit from starting another run.
      - name: Publish the Gradle log to the branch
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}" || true
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}" || git checkout "${GITHUB_REF_NAME}"
          mkdir -p ci-logs
          LOG="ci-logs/${GITHUB_JOB}-${GITHUB_RUN_NUMBER}.log"
          : > "$LOG"
          {
            echo "### job: ${GITHUB_JOB}  run: ${GITHUB_RUN_NUMBER}  sha: ${GITHUB_SHA}"
            echo "### errors and failures"
            grep -E "^e: |^w: |error:|FAILURE:|What went wrong|FAILED|Execution failed|error\(|\[Lint\]" gradle-build.log | head -300 || true
            echo
            echo "### tail of the console"
            tail -n 1200 gradle-build.log || true
          } >> "$LOG" 2>&1
          git add ci-logs
          git commit -m "ci: build log [skip ci]" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed"

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ── screenshot parity vs the mockup (M1 onward) ────────────────────────────
  # Renders the 5 destinations at 360 / 412 / 700 dp (light + dark) with Roborazzi
  # and uploads the PNGs, so the build can be eyeballed against
  # design/qa/mockup-ref/ without installing anything.
  screenshots:
    name: Screenshot parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: |
          set -o pipefail
          ./gradlew recordRoborazziDebug --stacktrace 2>&1 | tee gradle-screens.log

      # The sandbox this project is developed in cannot download Actions artifacts or
      # job logs, so the interesting part of the Gradle console is committed back to the
      # branch under ci-logs/ where it can simply be pulled and read. [skip ci] keeps
      # that commit from starting another run.
      - name: Publish the Gradle log to the branch
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}" || true
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}" || git checkout "${GITHUB_REF_NAME}"
          mkdir -p ci-logs
          LOG="ci-logs/${GITHUB_JOB}-${GITHUB_RUN_NUMBER}.log"
          : > "$LOG"
          {
            echo "### job: ${GITHUB_JOB}  run: ${GITHUB_RUN_NUMBER}  sha: ${GITHUB_SHA}"
            echo "### errors and failures"
            grep -E "^e: |^w: |error:|FAILURE:|What went wrong|FAILED|Execution failed|error\(|\[Lint\]" gradle-screens.log | head -300 || true
            echo
            echo "### tail of the console"
            tail -n 1200 gradle-screens.log || true
          } >> "$LOG" 2>&1
          git add ci-logs
          git commit -m "ci: build log [skip ci]" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed"

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rendered-screens-${{ github.sha }}
          path: |
            app/build/outputs/roborazzi/**
            app/src/test/snapshots/**
          if-no-files-found: error
          retention-days: 30

      - name: Verify against the recorded baseline
        run: ./gradlew verifyRoborazziDebug

  # ── release: tag v* ────────────────────────────────────────────────────────
  release:
    name: Release APK + AAB
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      # `secrets` is not a valid named-value inside an `if:` expression, so every
      # secret this job needs is surfaced as an env var and tested in the shell.
      UNSIGNED_NOTE: ${{ secrets.KEYSTORE_BASE64 == '' && '⚠️ This APK is **unsigned** — add the `KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS` and `KEY_PASSWORD` secrets to publish a signed build.' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/leaf-release.jks"
            echo "have_keystore=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK + AAB (signed)
        if: steps.keystore.outputs.have_keystore == 'yes'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName="${VERSION#v}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/leaf-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build release APK + AAB (unsigned — no keystore secrets yet)
        if: steps.keystore.outputs.have_keystore != 'yes'
        run: ./gradlew assembleRelease bundleRelease -PversionName="${VERSION#v}"

      - name: Collect outputs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} "out/leaf-${VERSION}.apk" \;
          find app/build/outputs/bundle/release -name '*.aab' -exec cp {} "out/leaf-${VERSION}.aab" \;
          find app/build/outputs/mapping/release -name 'mapping.txt' -exec cp {} "out/mapping-${VERSION}.txt" \; || true
          ls -lh out

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Leaf ${{ env.VERSION }}
          generate_release_notes: true
          files: out/*
          body: |
            Automated build of `${{ github.sha }}`.

            **Install** the APK on any Android 6.0+ device (allow installs from unknown sources).
            ${{ env.UNSIGNED_NOTE }}

