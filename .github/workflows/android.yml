# ─────────────────────────────────────────────────────────────────────────────
#  Leaf — Android CI/CD
#
#  Copy this file into the app repository as  .github/workflows/android.yml
#  (the build agent can do it: "add ci/android.yml from the design package as
#  .github/workflows/android.yml").
#
#  What it does
#    • every push / PR          → lint + unit tests + debug APK uploaded as an artifact
#    • every tag  v*            → signed release APK + AAB attached to a GitHub Release
#    • optional (commented)     → screenshot tests and emulator smoke tests
#
#  Required repository secrets — just TWO (Settings → Secrets and variables → Actions)
#    KEYSTORE_BASE64      base64 of your release keystore (.jks)
#    KEYSTORE_PASSWORD    the keystore password
#  Run  bash scripts/create-signing-keystore.sh  once and it creates the keystore,
#  invents a strong password and sets both secrets for you (via the gh CLI).
#  The alias defaults to "leaf" and the key password to the store password — add the
#  optional KEY_ALIAS / KEY_PASSWORD secrets only if you made a key with other values.
#  Without any of them the release job still runs and publishes an *unsigned* APK,
#  so the pipeline is green from the very first commit.
# ─────────────────────────────────────────────────────────────────────────────
name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # needed to publish releases

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"
  JAVA_VERSION: '17'       # AGP 8.13 requires JDK 17+

jobs:
  # ── every push and PR ──────────────────────────────────────────────────────
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Lint + unit tests
        run: ./gradlew lint testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ── screenshot parity vs the mockup (turn on at M1, see LEAF-AGENT-WORKFLOW.md) ──
  # Uncomment once Roborazzi/Paparazzi is wired into :app. It renders the 5
  # destinations + the reader and uploads the PNGs so you can eyeball the build
  # against design/qa/mockup-ref/ without installing anything.
  #
  # screenshots:
  #   name: Screenshot parity
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with: { distribution: temurin, java-version: '17' }
  #     - uses: gradle/actions/setup-gradle@v4
  #     - name: Render screenshots
  #       run: ./gradlew recordRoborazziDebug   # or recordPaparazziDebug
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: rendered-screens-${{ github.sha }}
  #         path: |
  #           app/build/outputs/roborazzi/**
  #           app/src/test/snapshots/**
  #         retention-days: 30
  #     - name: Verify against the recorded baseline (≤2 % diff)
  #       run: ./gradlew verifyRoborazziDebug   # or verifyPaparazziDebug

  # ── release: tag v* ────────────────────────────────────────────────────────
  release:
    name: Release APK + AAB
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the release keystore
        id: keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/leaf-release.jks"
          echo "have_keystore=yes" >> "$GITHUB_OUTPUT"

      - name: Build release APK + AAB (signed)
        if: steps.keystore.outputs.have_keystore == 'yes'
        env:
          # alias and key password default to what the setup script creates;
          # override with the optional KEY_ALIAS / KEY_PASSWORD secrets if you differ
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'leaf' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName="${VERSION#v}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/leaf-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build release APK + AAB (unsigned — no keystore secrets yet)
        if: steps.keystore.outputs.have_keystore != 'yes'
        run: ./gradlew assembleRelease bundleRelease -PversionName="${VERSION#v}"

      - name: Collect outputs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} "out/leaf-${VERSION}.apk" \;
          find app/build/outputs/bundle/release -name '*.aab' -exec cp {} "out/leaf-${VERSION}.aab" \;
          find app/build/outputs/mapping/release -name 'mapping.txt' -exec cp {} "out/mapping-${VERSION}.txt" \; || true
          ls -lh out

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Leaf ${{ env.VERSION }}
          generate_release_notes: true
          files: out/*
          body: |
            Automated build of `${{ github.sha }}`.

            **Install** the APK on any Android 6.0+ device (allow installs from unknown sources).
            ${{ secrets.KEYSTORE_BASE64 == '' && '⚠️ This APK is **unsigned** (dev build). Run `bash scripts/create-signing-keystore.sh` once and re-tag to publish a signed build.' || '' }}

