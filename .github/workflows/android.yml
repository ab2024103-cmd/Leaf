# ─────────────────────────────────────────────────────────────────────────────
#  Leaf — Android CI/CD
#
#  Copy this file into the app repository as  .github/workflows/android.yml
#  (the build agent can do it: "add ci/android.yml from the design package as
#  .github/workflows/android.yml").
#
#  What it does
#    • every push / PR          → lint + unit tests + debug APK uploaded as an artifact
#    • every push / PR          → Roborazzi screenshots for the Library and PDF reader
#    • every push / PR          → real PdfRenderer tests on API 23 and API 36
#    • every tag  v*            → signed release APK + AAB attached to a GitHub Release
#
#  Required repository secrets (Settings → Secrets and variables → Actions)
#    KEYSTORE_BASE64      base64 of your release keystore (.jks)     — optional at first
#    KEYSTORE_PASSWORD    the keystore password
#    KEY_ALIAS            the key alias inside the keystore
#    KEY_PASSWORD         the key password
#  Without them the release job still runs and publishes an *unsigned* APK,
#  so the pipeline is green from the very first commit.
# ─────────────────────────────────────────────────────────────────────────────
name: Android CI

on:
  push:
    # 'arena/**' covers the working branch this build is developed on: this
    # repository does not fire pull_request events, so push is the only trigger
    # that produces a run (and therefore an APK artifact) for a feature branch.
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # needed to publish releases

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"
  JAVA_VERSION: '17'       # AGP 8.13 requires JDK 17+

jobs:
  # ── every push and PR ──────────────────────────────────────────────────────
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Lint + unit tests
        run: |
          set -o pipefail
          ./gradlew lint testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle-verification.log

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics-${{ github.sha }}
          path: gradle-verification.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Surface Gradle errors in check annotations
        if: failure()
        env:
          LOG_FILE: gradle-verification.log
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          lines = Path(os.environ["LOG_FILE"]).read_text(errors="replace").splitlines()
          diagnostics = [line for line in lines if re.search(r"(^e: |^FAILURE:|^Execution failed for task|^Caused by:|error:|FAILED|^> Task .* FAILED)", line)]
          test_failures = []
          for report in Path("app/build/test-results").glob("testDebugUnitTest/TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      detail = (failure.get("message") or "") + "\n" + (failure.text or "")
                      test_failures.append(f"{case.get('classname')}.{case.get('name')}: {detail[:3000]}")
          lint_issues = []
          for report in Path("app/build/reports").glob("lint-results*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for issue in root.iter("issue"):
                  if issue.get("severity", "").lower() not in {"error", "fatal"}:
                      continue
                  location = issue.find("location")
                  source = ""
                  if location is not None:
                      source = f" ({location.get('file', '')}:{location.get('line', '?')})"
                  lint_issues.append(f"{issue.get('severity')}: {issue.get('id')}: {issue.get('message')}{source}")
          sections = []
          if diagnostics:
              sections.append("Gradle error lines:\n" + "\n".join(diagnostics[-20:]))
          if test_failures:
              sections.append("JUnit failures:\n" + "\n---\n".join(test_failures[:10]))
          if lint_issues:
              sections.append("Lint errors:\n" + "\n".join(lint_issues[:30]))
          sections.append("Gradle output tail:\n" + "\n".join(lines[-40:]))
          message = "\n\n".join(sections)
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle failure details::{escaped}")
          PY

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ── deterministic UI captures (M1 onward) ──────────────────────────────────
  # Renders the five shell destinations plus the reader's 12 size/theme cases and
  # uploads the PNGs, so they can be reviewed against design/qa/mockup-ref/.
  screenshots:
    name: Screenshot parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: |
          set -o pipefail
          ./gradlew recordRoborazziDebug --stacktrace --console=plain 2>&1 | tee screenshot-verification.log

      - name: Upload screenshot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diagnostics-${{ github.sha }}
          path: screenshot-verification.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Surface screenshot errors in check annotations
        if: failure()
        env:
          LOG_FILE: screenshot-verification.log
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          lines = Path(os.environ["LOG_FILE"]).read_text(errors="replace").splitlines()
          diagnostics = [line for line in lines if re.search(r"(^e: |^FAILURE:|^Execution failed for task|^Caused by:|error:|FAILED|^> Task .* FAILED)", line)]
          test_failures = []
          for report in Path("app/build/test-results").glob("testDebugUnitTest/TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      detail = (failure.get("message") or "") + "\n" + (failure.text or "")
                      test_failures.append(f"{case.get('classname')}.{case.get('name')}: {detail[:3000]}")
          sections = []
          if diagnostics:
              sections.append("Screenshot error lines:\n" + "\n".join(diagnostics[-20:]))
          if test_failures:
              sections.append("JUnit failures:\n" + "\n---\n".join(test_failures[:10]))
          sections.append("Screenshot output tail:\n" + "\n".join(lines[-40:]))
          message = "\n\n".join(sections)
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Screenshot failure details::{escaped}")
          PY

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rendered-screens-${{ github.sha }}
          path: |
            app/build/outputs/roborazzi/**
            app/src/test/snapshots/**
          if-no-files-found: error
          retention-days: 30

      - name: Verify against the recorded baseline
        run: ./gradlew verifyRoborazziDebug


  # ── release: tag v* ────────────────────────────────────────────────────────
  release:
    name: Release APK + AAB
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      # `secrets` is not a valid named-value inside an `if:` expression, so every
      # secret this job needs is surfaced as an env var and tested in the shell.
      UNSIGNED_NOTE: ${{ secrets.KEYSTORE_BASE64 == '' && '⚠️ This APK is **unsigned** — add the `KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS` and `KEY_PASSWORD` secrets to publish a signed build.' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/leaf-release.jks"
            echo "have_keystore=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK + AAB (signed)
        if: steps.keystore.outputs.have_keystore == 'yes'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName="${VERSION#v}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/leaf-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build release APK + AAB (unsigned — no keystore secrets yet)
        if: steps.keystore.outputs.have_keystore != 'yes'
        run: ./gradlew assembleRelease bundleRelease -PversionName="${VERSION#v}"

      - name: Collect outputs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} "out/leaf-${VERSION}.apk" \;
          find app/build/outputs/bundle/release -name '*.aab' -exec cp {} "out/leaf-${VERSION}.aab" \;
          find app/build/outputs/mapping/release -name 'mapping.txt' -exec cp {} "out/mapping-${VERSION}.txt" \; || true
          ls -lh out

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Leaf ${{ env.VERSION }}
          generate_release_notes: true
          files: out/*
          body: |
            Automated build of `${{ github.sha }}`.

            **Install** the APK on any Android 6.0+ device (allow installs from unknown sources).
            ${{ env.UNSIGNED_NOTE }}

  # ── real PdfRenderer verification on the minSdk and current Android ───────
  pdf-engine:
    name: Real PDF · API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [23, 36]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for emulator runners
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0

      - name: Install PDF test emulator image and create AVD
        env:
          API_LEVEL: ${{ matrix.api }}
          SYSTEM_IMAGE_TARGET: ${{ matrix.api == 23 && 'default' || 'google_apis' }}
        run: |
          set -euo pipefail
          exec > >(tee -a emulator-setup.log) 2>&1
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME" "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$SDKMANAGER" || ! -x "$AVDMANAGER" ]]; then
            echo "Android command-line tools were not found under $ANDROID_HOME/cmdline-tools/latest/bin"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install --channel=0 \
            'build-tools;37.0.0' platform-tools emulator "platforms;android-${API_LEVEL}" \
            "system-images;android-${API_LEVEL};${SYSTEM_IMAGE_TARGET};x86_64"
          "$AVDMANAGER" create avd --force -n test --device pixel_2 \
            --package "system-images;android-${API_LEVEL};${SYSTEM_IMAGE_TARGET};x86_64"
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME"
          for executable in "$ANDROID_HOME/emulator/emulator" "$ANDROID_HOME/platform-tools/adb"; do
            if [[ ! -x "$executable" ]]; then
              echo "Required Android tool is missing or not executable: $executable"
              find "$ANDROID_HOME" -maxdepth 5 -type f \( -name emulator -o -name adb \) -print || true
              exit 1
            fi
            ls -l "$executable"
          done
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Boot emulator and run real-PDF tests
        timeout-minutes: 60
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          exec > >(tee -a emulator-setup.log) 2>&1
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          EMULATOR_LOG="pdf-emulator-api-${API_LEVEL}.log"
          GRADLE_LOG="pdf-engine-api-${API_LEVEL}.log"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          sed -i -e '/^hw.ramSize=/d' -e '/^hw.cpu.ncore=/d' "$ANDROID_AVD_HOME/test.avd/config.ini"
          printf '%s\n' 'hw.ramSize=4096M' 'hw.cpu.ncore=2' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          "$EMULATOR" -version
          "$EMULATOR" -avd test -port 5554 -no-window -gpu swiftshader_indirect \
            -no-snapshot -noaudio -no-boot-anim -accel on > "$EMULATOR_LOG" 2>&1 &
          emulator_pid=$!
          cleanup() {
            timeout 5s "$ADB" -s emulator-5554 emu kill >/dev/null 2>&1 || kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          timeout 30s "$ADB" start-server
          booted=0
          boot_started=$SECONDS
          boot_deadline=$((boot_started + 900))
          attempt=0
          while (( SECONDS < boot_deadline )); do
            attempt=$((attempt + 1))
            state=$(timeout 5s "$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [[ "$state" == "1" ]]; then
              booted=1
              echo "Emulator API $API_LEVEL booted after $((SECONDS - boot_started)) seconds."
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator process exited before boot completed."
              timeout 5s "$ADB" devices -l || true
              tail -n 120 "$EMULATOR_LOG" || true
              exit 1
            fi
            if (( attempt % 10 == 0 )); then
              echo "Still waiting for API $API_LEVEL emulator ($((SECONDS - boot_started))s elapsed)."
              timeout 5s "$ADB" devices -l || true
            fi
            sleep 2
          done
          if [[ "$booted" != "1" ]]; then
            echo "Timed out waiting for API $API_LEVEL emulator after 15 minutes."
            timeout 5s "$ADB" devices -l || true
            tail -n 120 "$EMULATOR_LOG" || true
            exit 1
          fi
          timeout 20s "$ADB" -s emulator-5554 shell input keyevent 82
          timeout 20s "$ADB" -s emulator-5554 shell settings put global window_animation_scale 0.0
          timeout 20s "$ADB" -s emulator-5554 shell settings put global transition_animation_scale 0.0
          timeout 20s "$ADB" -s emulator-5554 shell settings put global animator_duration_scale 0.0
          timeout -k 10s 35m ./gradlew connectedDebugAndroidTest --stacktrace --console=plain 2>&1 | tee "$GRADLE_LOG"

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-engine-diagnostics-api-${{ matrix.api }}-${{ github.sha }}
          path: |
            pdf-engine-api-${{ matrix.api }}.log
            pdf-emulator-api-${{ matrix.api }}.log
            emulator-setup.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Surface emulator errors in check annotations
        if: failure()
        env:
          API_LEVEL: ${{ matrix.api }}
          LOG_FILE: pdf-engine-api-${{ matrix.api }}.log
          EMULATOR_LOG: pdf-emulator-api-${{ matrix.api }}.log
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          api_level = os.environ["API_LEVEL"]
          log_file = Path(os.environ["LOG_FILE"])
          setup_log = Path("emulator-setup.log")
          emulator_log = Path(os.environ["EMULATOR_LOG"])
          if not log_file.exists() or log_file.stat().st_size == 0:
              sections = [f"API {api_level}: emulator failed before Gradle produced output."]
              for diagnostic_log, label in ((setup_log, "setup"), (emulator_log, "emulator")):
                  if not diagnostic_log.exists():
                      continue
                  rows = diagnostic_log.read_text(errors="replace").splitlines()
                  pattern = r"(timed out|still waiting|booted|devices|boot|failed|error|fatal|warning|exception)"
                  relevant = [line for line in rows if re.search(pattern, line, re.IGNORECASE)]
                  selected = (relevant[-12:] if relevant else rows[-12:])
                  sections.append(f"{label} log tail:\n" + "\n".join(line[:240] for line in selected))
              message = "\n\n".join(sections)
          else:
              lines = log_file.read_text(errors="replace").splitlines()
              diagnostics = [line for line in lines if re.search(r"(^e: |^FAILURE:|^Execution failed for task|^Caused by:|error:|AssertionError|Exception:)", line)]
              sections = [f"API {api_level} Gradle output tail:\n" + "\n".join(line[:240] for line in lines[-24:])]
              if diagnostics:
                  sections.insert(0, "Gradle error lines:\n" + "\n".join(line[:240] for line in diagnostics[-16:]))
              message = "\n\n".join(sections)
          if len(message) > 3500:
              message = message[:100] + "\n… diagnostic output truncated …\n" + message[-3300:]
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=API {api_level} emulator diagnostics::{escaped}")
          PY
