# TEMPORARY diagnostic scaffold — deleted before this milestone is handed over.
#
# The sandbox that drives this repository cannot reach
# results-receiver.actions.githubusercontent.com, so Actions logs cannot be read
# from here. This workflow commits the Gradle output to the branch and posts its
# tail as a PR comment, both of which are readable through api.github.com.
name: CI logs
on: push

permissions:
  contents: write
  pull-requests: write

jobs:
  build-log:
    name: Capture the Gradle output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run the Gradle build
        run: |
          mkdir -p ci-logs
          set +e
          ./gradlew lint testDebugUnitTest assembleDebug --stacktrace > ci-logs/build.txt 2>&1
          ./gradlew recordRoborazziDebug --stacktrace >> ci-logs/build.txt 2>&1
          echo "gradle-exit=$?" >> ci-logs/summary.txt
          set -e
          tail -c 200000 ci-logs/build.txt > ci-logs/tail.txt
          mv ci-logs/tail.txt ci-logs/build.txt

      - name: Publish the log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git config user.name "Leaf build agent"
          git config user.email "agent@arena.ai"
          git pull --rebase origin arena/ceade348-leaf
          mkdir -p ci-logs app/src/test/snapshots
          git add -f ci-logs
          git add -f app/src/test/snapshots
          git diff --cached --quiet || git commit -m "ci: build log [skip ci]"
          git push origin HEAD:arena/ceade348-leaf
          echo "push-exit=$?" >> ci-logs/summary.txt

          {
            echo '```'
            echo "gradle $(cat ci-logs/summary.txt)"
            echo '```'
            echo
            echo '```text'
            tail -n 250 ci-logs/build.txt
            echo '```'
          } > ci-logs/comment.md
          gh pr comment 1 --body-file ci-logs/comment.md
          echo "comment-exit=$?" >> ci-logs/summary.txt
